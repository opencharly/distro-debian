#  opencharly/debian — the skill-prose bundle for the debian image family.
#
#  WHY THIS CANDY EXISTS (opencharly/sdk#434, operator ruling): a `skill:` node's `owner:` must
#  name a CANDY. An image — a `candy:` node carrying `base:`/`from:` — has no source directory: the
#  loader folds it into the image set and never the layer set, so an image-owned skill's prose can
#  never be read AND the node is silently absent from the `ai.opencharly.skill` OCI label.
#  The 5 `skill:` nodes below were all owned by an image; this candy owns them instead, and their
#  bodies live at THIS REPO'S ROOT, `.agents/skills/<name>/SKILL.md` (the Agent-Skills standard
#  tree) — the one base the marketplace/docs generators and the label projection read after
#  opencharly/sdk#445 (`deploykit.candyRepoRoot`), NOT this carrier's own directory, which is
#  where the sdk#434 re-home had put them and the sdk#445 ruling replaced.
#
#  THE INSTALL STEP BELOW IS PRE-EXISTING BROKEN AND IS TRACKED, NOT HIDDEN: a carrier candy's
#  `copy: .agents/skills` renders no Containerfile directive at all, identically on the moved and
#  the unmoved tree (opencharly/sdk#444), and the source it names is the PRE-MOVE tree, so no
#  reader resolves it any more. It is left as-is because the fix is a DECISION about `copy:`'s
#  base — a root-relative source form the emitter understands — and a `../` re-spelling of this
#  path would be the workaround the rulebook forbids. sdk#444 owns it.
debian-skills:
    candy:
        description: |
            Skill-prose bundle for the debian image family: owns the `debian`, `debian-builder`, `debian-coder`, `debian-debootstrap-builder`, `debian-debootstrap` `skill:`
            entities (sibling nodes in this file) and carries their bodies under
            .agents/skills/<name>/SKILL.md.
            It exists because a `skill:` node's owner must be a candy, not an image — an image has
            no source directory, so an image-owned node's prose is unreadable and the skill is
            absent from the ai.opencharly.skill OCI label (opencharly/sdk#434).
            Composed into every image that carries one of those skills; installs the tree at the
            uid-1000 account's ~/.agents/skills so a harness in the image reads the same prose the
            label carries.
        plan:
            - run: install the skill tree at the uid-1000 account's Agent-Skills location
              id: install-skill-tree
              copy: .agents/skills
              to: "${HOME}/.agents/skills"
              run_as: "${USER}"
              comment: the bodies the ai.opencharly.skill label projects, made readable in-image
            - check: every skill body this candy carries is installed under the uid-1000 account's ~/.agents/skills
              id: skill-bodies-installed
              context:
                - build
              exit_status: 0
              command: |
                  set -eu
                  H="$(awk -F: '$3 == 1000 { print $6 }' /etc/passwd)"
                  test -n "$H"
                  for s in debian debian-builder debian-coder debian-debootstrap-builder debian-debootstrap; do
                      test -s "$H/.agents/skills/$s/SKILL.md"
                  done
debian-skill:
    skill:
        name: debian
        family: distros
        owner: debian-skills
        triggers:
            - "Debian images / `debian*` / `box/debian` submodule"

debian-builder-skill:
    skill:
        name: debian-builder
        family: distros
        owner: debian-skills
        triggers:
            - "Debian images / `debian*` / `box/debian` submodule"

debian-coder-skill:
    skill:
        name: debian-coder
        family: coder
        owner: debian-skills
        triggers:
            - "Debian images / `debian*` / `box/debian` submodule"

debian-debootstrap-builder-skill:
    skill:
        name: debian-debootstrap-builder
        family: distros
        owner: debian-skills

debian-debootstrap-skill:
    skill:
        name: debian-debootstrap
        family: distros
        owner: debian-skills
        triggers:
            - "Debian images / `debian*` / `box/debian` submodule"

