debian:
    candy:
        base: debian:13
        build:
            - deb
        builder:
            cargo: debian-builder
            npm: debian-builder
            pixi: debian-builder
        produce:
            - pixi
            - npm
            - cargo
        distro:
            - debian:13
            - debian
        # The skill-prose bundle: a `skill:` node's owner must be a candy, not an image
        # (opencharly/sdk#434), so the image-owned skill nodes are owned by `debian-skills` and it rides
        # this image so those skills reach the ai.opencharly.skill label.
        candy:
            - debian-skills
