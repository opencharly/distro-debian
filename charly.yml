#  opencharly/distro-debian — the Debian image family, split out of the main
#  opencharly repo (2026-05). Mounted as a git submodule at box/debian.
#
#  SINGLE-FILE config (2026-05 import-namespace cutover): every local entity
#  (the debian base + debootstrap family, the debian-coder kitchen-sink image,
#  the debian bootstrap VM, the disposable check bed) is inlined here. This repo
#  VENDORS NOTHING — every layer is an `@github.com/...` ref into main's shared
#  candy library, and the shared build-config (distro/builder/init vocabulary) is
#  EMBEDDED in the `charly` binary (`charly/charly.yml`) — not imported.
#
#  import: is a LIST — here EMPTY (`import: []`). Debian roots its bases on the
#  upstream docker.io `debian:13` image directly (no main base-stack dependency)
#  and the build vocabulary is embedded, so it imports NOTHING. The only cross-repo
#  edge is debian → main's shared candy layers via `@github` refs; there is NO
#  main ↔ debian coupling.
#
#  Directly buildable: `charly box build debian` (the build verb defaults to this
#  charly.yml). From the parent repo: `charly -C box/debian box build
#  debian`, or anywhere: `charly --repo opencharly/distro-debian box build debian`.
version: 2026.261.1747
defaults:
    platform:
        - linux/amd64
    tag: auto
    registry: ghcr.io/opencharly
    build:
        - deb
    merge:
        auto: false
        max_mb: 128
import: []
# Disposable R10 test bed for the debian bootstrap VM (kind:check — the
# 2026-05 deploy→check unification moved repo-shipped disposable beds out of
# deploy.yml). disposable: true is the sole authorization for the unattended
# destroy+rebuild driven by `charly check run check-debian-debootstrap-vm`.
check-debian-debootstrap-vm:
    vm:
        from: debian-debootstrap
        disposable: true
        lifecycle: dev
        description: Sole proof the charly toolchain installs on a from-scratch debootstrap Debian 13 VM — the charly candy's copy step lands the binary at /usr/bin/charly, the composed virtualization/gocryptfs/socat layers install their deps, and the tailscale apt-repo distro-cascade deterministically picks debian/trixie. Boots a debootstrap Debian 13 rootfs as a libvirt/QEMU VM (uefi-insecure, an auto-allocated ssh port), overlays the charly candy via add_candy, then runs four guest command checks — the binary present and executable at /usr/bin/charly (CHARLY-BINARY-OK), the welded command plugins dispatching project-less (WELDED-CMD-PROJECT-LESS-OK), the tailscale package installed (TAILSCALE-PKG-OK), and a grep asserting tailscale.list resolved to 'debian trixie'.
        # charly binary install witness: the charly candy's copy step lands the
        # in-development binary at /usr/bin/charly (the localpkg package install is
        # removed by the remove-candy-localpkg cutover). tailscale is NOT in the
        # binary — the charly candy supplies it via the tailscale apt repo, so it
        # must ALSO be present after deploy, which the tailscale-package-installed
        # check below asserts directly (the sources.list grep proves only that the
        # right suite was selected, not that the package landed).
        add_candy:
            - '@github.com/opencharly/layer-charly:v2026.241.1407'
        install_opts:
            allow_repo_changes: true
            allow_root_tasks: true
            skip_incompatible: true # skip composed layers lacking a guest-format section; the charly candy's copy step + composed layers install the binary and deps
        plan:
            - check: |
                command=test -x /usr/bin/charly &&
                /usr/bin/charly version &&
                echo CHARLY-BINARY-OK
              id: charly-binary-installed
              description: charly binary installed on the guest AT /usr/bin/charly via the charly candy's copy step (the localpkg package install is removed by the remove-candy-localpkg cutover). Path-anchored deliberately — an unanchored `command -v charly` would also be satisfied by the host binary the deploy stages under /tmp, so it cannot prove the copy step landed the file at its destination.
              stdout:
                - contains: CHARLY-BINARY-OK
              exit_status: 0
              context:
                - runtime
              command: |
                test -x /usr/bin/charly &&
                /usr/bin/charly version &&
                echo CHARLY-BINARY-OK
            - check: command=dpkg -s tailscale >/dev/null 2>&1 && echo TAILSCALE-PKG-OK
              id: tailscale-package-installed
              description: the tailscale PACKAGE reached the guest via the charly candy's tailscale apt repo — tailscale is not in the charly binary, so the apt-repo cascade delivering it is exactly what this bed exists to prove. Asserting the sources.list entry alone would prove the repo was configured, not that the package installed.
              stdout:
                - contains: TAILSCALE-PKG-OK
              exit_status: 0
              context:
                - runtime
              command: dpkg -s tailscale >/dev/null 2>&1 && echo TAILSCALE-PKG-OK
            - check: the welded command plugins dispatch project-less from the installed charly binary
              id: welded-command-project-less
              description: the charly binary's compiled-in command:<word> plugins (doctor/vm/clean/…) dispatch project-less from /tmp on the installed binary
              stdout:
                - contains: WELDED-CMD-PROJECT-LESS-OK
              exit_status: 0
              context:
                - runtime
              command: |
                cd /tmp &&
                /usr/bin/charly doctor 2>/dev/null | grep -q 'Summary:' &&
                echo WELDED-CMD-PROJECT-LESS-OK
            - check: command=grep -h 'pkgs[.]tailscale[.]com/stable/debian trixie' /etc/apt/sources.list.d/tailscale.list
              id: tailscale-repo-suite-debian-trixie
              description: distro-cascade resolves the debian/trixie tailscale apt repo (not ubuntu/noble) deterministically
              exit_status: 0
              context:
                - runtime
              command: grep -h 'pkgs[.]tailscale[.]com/stable/debian trixie' /etc/apt/sources.list.d/tailscale.list
# Disposable R10 pod bed for the debian-coder developer image — closes the
# pod×debian cross-cell the submodule previously lacked (it shipped only the
# debootstrap VM bed above), mirroring box/fedora's check-fedora-coder-pod on
# the deb substrate. No `port:` — every inherited container port (sshd 2222,
# charly-mcp 18765) auto-allocates a free 127.0.0.1 host port at deploy,
# conflict-free across concurrent beds.
check-debian-coder-pod:
    pod:
        image: debian-coder
        disposable: true
        lifecycle: dev
        description: R10 bed for the debian-coder image — proves the Debian developer pod (sshd + language runtimes + AI CLIs on the Debian 13 base) builds and runs as one composed pod. Builds box:debian-coder, deploys it, and runs the composed candies' baked file/package/service/command/addr checks plus the bed's own sshd-service, language-runtime-binary, and charly status --json (status-shows-pod) probes.
        plan:
            - check: the supervised sshd service is running in the composed developer pod
              id: sshd-service-running
              context:
                - runtime
              service:
                service: sshd
                running: true
            - check: the Go language-runtime binary is baked into the developer pod
              id: golang-binary-present
              file:
                file: /usr/bin/go
                exists: true
            - check: command=charly status --json
              id: status-shows-pod
              stdout:
                - contains: '"kind": "pod"'
                - contains: check-debian-coder-pod
              context:
                - runtime
              command:
                command: charly status --json
                in_container: false
debian-debootstrap:
    vm:
        #  `source.kind: bootstrap` builds a Debian rootfs from scratch via
        #  debootstrap inside the debian-debootstrap-builder container, then boots
        #  it under libvirt/QEMU. The debootstrap builder template + distro.debian
        #  config resolve from the embedded build vocabulary (`charly/charly.yml`).
        source:
            kind: bootstrap
            builder: debootstrap
            builder_image: debian-debootstrap-builder
            distro: debian
            package:
                - sudo
                - openssh-server
                - qemu-guest-agent
                - cloud-init
            rootfs: ext4
            kernel_args: console=tty0 console=ttyS0,115200
        disk_size: 20G
        ram: 4G
        cpu: 2
        machine: q35
        firmware: uefi-insecure
        network:
            mode: user
        ssh:
            user: debian
            port_auto: true
            key_source: generate
        cloud_init:
            users:
                - name: debian
                  sudo: true
                  shell: /bin/bash
            runcmd:
                - systemctl enable --now ssh
                - systemctl enable --now qemu-guest-agent
                # Diagnostic: write boot state to /boot for post-mortem mount.
                - "{ ip a; echo ===listen===; ss -tlnp; echo ===ssh===; systemctl status ssh --no-pager; } > /boot/charly-diag.txt 2>&1"
discover:
    - path: box
      recursive: true
    - path: candy
      recursive: true
debian-builder-skill:
    skill:
        name: debian-builder
        family: distros
        owner: debian-builder
        description: |-
            Minimal Debian 13 builder image (pixi + Node.js + build-toolchain) used
            as the multi-stage builder for every box based on Debian — currently
            debian-coder. Produces the pre-compiled pixi envs, npm globals, and
            cargo crates that land in the final runtime image via COPY --from.
            MUST be invoked before building, deploying, configuring, or troubleshooting
            the debian-builder box.
        triggers:
            - "Debian images / `debian*` / `box/debian` submodule"
        content: |
            # debian-builder
            
            Debian 13 counterpart of `/charly-distros:fedora-builder`. Provides the pixi / npm / cargo build environments so downstream Debian boxes (currently `/charly-coder:debian-coder`) get pre-compiled artifacts from a dedicated builder stage without bloating the final image.
            
            Lives in the **`opencharly/distro-debian`** repo (git submodule at **`box/debian`**).
            Build it from the submodule: `charly -C box/debian box build debian-builder`
            (normally it builds implicitly as a dependency of `debian-coder`). Its
            `pixi`/`nodejs`/`build-toolchain` layers are pulled by github reference from the
            main repo.
            
            ## Box Properties
            
            | Property | Value |
            |----------|-------|
            | Base | `debian` (which = `debian:13` + our bootstrap) |
            | Layers | `pixi`, `nodejs`, `build-toolchain` |
            | Platforms | `linux/amd64` |
            | Registry | `ghcr.io/opencharly` |
            | User | `user` / uid 1000 (create mode — `debian:13` ships no pre-existing uid-1000 account) |
            
            ## Full candy stack
            
            1. `/charly-distros:debian` — Debian 13 + our `apt-get update && apt-get install -y --no-install-recommends curl ca-certificates gnupg` bootstrap + go-task binary + `user:user` uid 1000.
            2. `/charly-languages:pixi` — pixi package manager + env paths.
            3. `/charly-coder:nodejs` — Node.js + npm (generic `nodejs` — Debian's packaged Node).
            4. `/charly-coder:build-toolchain` — gcc, g++, cmake, autoconf, ninja, pkg-config, and the full set of `-dev` libraries (Debian equivalents of Fedora's `-devel`). Used by cargo crates that link system libs (libva, x264, ffmpeg, wayland, xkbcommon, etc.).
            
            ## Role in the build system
            
            Declares `builds: [pixi, npm, cargo]` and is listed as `debian-coder`'s builder for all three types via:
            
            ```yaml
            debian:
              builder:
                pixi: debian-builder
                npm: debian-builder
                cargo: debian-builder
            ```
            
            During `charly box build debian-coder`, any candy that ships `pixi.toml` / `package.json` / `Cargo.toml` gets a multi-stage `FROM debian-builder AS <layer>-<builder>-build` section emitted by the generator, then `COPY --from=<stage> --chown=${UID}:${GID}` into the final image. See `/charly-internals:generate-source` for the template.
            
            No AUR equivalent (unlike `/charly-distros:arch-builder`) — AUR is an Arch-only concept.
            
            ## Cross-distro sibling builders
            
            - `/charly-distros:fedora-builder` — Fedora 43 equivalent (+ `rpmfusion` for x264/ffmpeg/libva headers).
            - `/charly-distros:arch-builder` — Arch Linux equivalent + `yay` for AUR.
            - `/charly-distros:ubuntu-builder` — Ubuntu 24.04 equivalent; differs from this box mainly in `user:ubuntu` vs `user:user` (adopt mode — see `/charly-distros:ubuntu`).
            
            ## Quick start
            
            ```bash
            charly -C box/debian box build debian-builder
            charly shell debian-builder
            ```
            
            Typically not invoked directly — it's a build-time dependency of `/charly-coder:debian-coder`.
            
            ## Verification
            
            - `charly -C box/debian box list | grep debian-builder` — box present.
            - `charly shell debian-builder -- pixi --version && node --version && gcc --version`.
            
            ## Related boxes
            
            - `/charly-distros:debian` — parent base, declares the bootstrap packages in the embedded `distro:` vocabulary.
            - `/charly-coder:debian-coder` — the consumer that this builder exists to serve.
            - `/charly-distros:fedora-builder` — RPM-family sibling.
            - `/charly-distros:arch-builder` — pacman + AUR sibling.
            - `/charly-distros:ubuntu-builder` — Ubuntu 24.04 sibling.
            
            ## Related candies
            
            - `/charly-languages:pixi`, `/charly-coder:nodejs`, `/charly-coder:build-toolchain`
            
            ## Related commands
            
            - `/charly-build:build` — multi-stage builders, `base_user:` declaration
            - `/charly-image:image` — `produce:` + `builder:` fields
            - `/charly-build:generate` — COPY-from stage emission
            
            ## When to use this skill
            
            **MUST be invoked** when:
            
            - Building or troubleshooting `debian-builder` itself.
            - Debugging multi-stage `COPY --from` errors in a `debian-coder` build (the source stage is this image).
            - Adding a new builder capability (e.g. a `dotnet` build type) to deb-family images.

debian-coder-skill:
    skill:
        name: debian-coder
        family: coder
        owner: debian-coder
        description: |-
            Kitchen-sink development box on Debian 13 trixie: coding + AI-coding
            CLIs + DevOps tooling in one container. Debian base, a large set of direct candies
            mirroring fedora-coder's stack but with deb: sections. Runs as uid 1000
            (`user`) with passwordless sudo. 143/0 tests pass.
            Use when working with the debian-coder box — or when comparing
            cross-distro parity across the four coder-family boxes.
        triggers:
            - "Debian images / `debian*` / `box/debian` submodule"
        content: |-
            # debian-coder
            
            Debian 13 trixie counterpart of `/charly-coder:fedora-coder`. Same 80-line `check:` block, same large candy list, same rootless posture (uid 1000 + passwordless sudo). Key wrinkles are all Debian-specific packaging quirks handled inside individual candies: `bat → batcat` symlink, Microsoft's `dotnet-install.sh` cross-distro installer, and package-existence tests (vs binary-path tests) for `virtualization` because Debian bundles libvirt drivers differently.
            
            > **Location:** lives in the **`opencharly/distro-debian`** repo (git submodule at
            > **`box/debian`**), in that repo's config (its `charly.yml` + per-kind
            > sibling files). Its `debian` base is owned by the same submodule; its
            > candies are pulled by github reference from the main repo. Build/validate from
            > the submodule:
            > `charly -C box/debian box build debian-coder`, or
            > `charly --repo opencharly/distro-debian box build debian-coder`. Deploy-mode verbs
            > (`charly config`/`charly start`/`charly check box`) read the built image's OCI labels and
            > work from anywhere once it's in local storage.
            
            ## Definition
            
            ```yaml
            debian-coder:
              base: debian
              ports:
                - "2222:2222"                 # sshd-wrapper
                - "18765:18765"               # charly-mcp (Streamable HTTP)
              candy:
                # Baseline
                - agent-forwarding
                - sshd
                - charly
                - charly-mcp
                - container-nesting
                - '@github.com/opencharly/pod-dbus'
                - '@github.com/opencharly/layer-tmux'
            
                # Language runtimes
                - language-runtimes           # Go + PHP + .NET 9 (via Microsoft dotnet-install.sh)
                - '@github.com/opencharly/layer-golang'
                - '@github.com/opencharly/layer-nodejs'  # Debian's packaged Node
                - rust
                - pixi
                - uv
            
                # Build + developer tooling
                - build-toolchain
                - dev-tools                   # ripgrep, bat→batcat symlink, fd-find, neovim, …
                - pre-commit
                - direnv
                - gh
                - typst
                - asciinema
            
                # AI coding CLIs
                - claude-code
                - codex
                - '@github.com/opencharly/layer-gemini'
                - forgecode
                - oracle
            
                # DevOps / cloud / infra
                - devops-tools
                - '@github.com/opencharly/layer-kubernetes'
                - docker-ce
                - github-actions
                - google-cloud
                - google-cloud-npm
                - grafana-tools
            ```
            
            ## User model — create mode
            
            The `debian:13` upstream base image ships **no** pre-existing uid-1000 account. The embedded `distro.debian` vocabulary declares no `base_user:`, so `user_policy: auto` (the default) falls through to create mode. The bootstrap section of `.build/debian/Containerfile` emits:
            
            ```
            RUN if ! getent passwd 1000 >/dev/null 2>&1; then
                  LOGIN_SHELL=/bin/sh; [ -x /bin/bash ] && LOGIN_SHELL=/bin/bash;
                  if command -v useradd >/dev/null 2>&1; then
                    (getent group 1000 >/dev/null 2>&1 || groupadd -g 1000 user) &&
                    useradd -m -u 1000 -g 1000 -s "$LOGIN_SHELL" user;
                  else
                    (getent group 1000 >/dev/null 2>&1 || addgroup -g 1000 user) &&
                    adduser -D -h /home/user -u 1000 -G user -s "$LOGIN_SHELL" user;
                  fi;
                fi
            ```
            
            Resolved identity: `User=user, UID=1000, GID=1000, Home=/home/user`. Identical to fedora-coder / arch-coder. Contrast with `/charly-coder:ubuntu-coder` which runs adopt mode on `ubuntu:ubuntu`.
            
            See `/charly-image:image` "user_policy" and `/charly-build:build` "base_user" for the full decision table.
            
            ## Security posture
            
            | Field | Value | Source |
            |---|---|---|
            | `cap_add` | **(empty)** | — |
            | `security_opt` | `[unmask=/proc/*]` | `/charly-distros:container-nesting` |
            | `devices` | `[/dev/fuse, /dev/net/tun]` | `/charly-distros:container-nesting` |
            | `privileged` | `false` | — |
            | Network | bridge | defaults |
            | UID / user | `1000 / user` | create mode |
            | sudo | passwordless via `/etc/sudoers.d/charly-user` (discovered via `getent passwd 1000`) | `/charly-coder:sshd` |
            
            ## Debian-specific layer quirks
            
            - **bat → batcat symlink** (`/charly-coder:dev-tools`). Debian and Ubuntu rename `bat` → `batcat` to avoid a namespace collision with a legacy `bacula` utility. The dev-tools candy ships a distro-tolerant cmd task that creates `/usr/bin/bat -> /usr/bin/batcat` when only batcat is present; no-op on Fedora/Arch.
            - **dotnet-sdk-9.0 via Microsoft's `dotnet-install.sh`** (`/charly-coder:language-runtimes`). Debian 13 main ships no .NET; Microsoft's trixie apt repo has dotnet-sdk-9.0, but using the official cross-distro `dotnet-install.sh` channel-pin to `9.0` gives version parity with Ubuntu (whose Microsoft noble repo only ships 10.0). Installs to `/usr/share/dotnet` + symlinks `/usr/bin/dotnet`.
            - **libvirt tests use `package:` not `file:`** (`/charly-infrastructure:virtualization`). Debian bundles libvirt drivers differently from Fedora's split packaging, so `file: /usr/sbin/virtqemud` would false-fail. The candy probes via `package: libvirt-daemon-driver-qemu` + `package_map:` per-distro package name.
            - **sudoers via `getent`** (`/charly-coder:sshd`). Instead of hardcoding `user ALL=…`, the candy runs `getent passwd 1000 | cut -d: -f1` at build time to discover the actual uid-1000 account. On debian-coder that returns `user`; on ubuntu-coder it returns `ubuntu`. One cross-distro implementation, no special cases.
            
            ## Test results
            
            `charly check box ghcr.io/opencharly/debian-coder:latest` — **143 passed · 0 failed · 0 skipped**.
            
            Against a live running container, the same command adds live-service extension tests (sshd on 2222, supervisord, dbus, charly-mcp, the libvirt `qemu:///session` daemon — `libvirtd` on Debian, not the Fedora/Arch modular `virtqemud`), mirroring fedora-coder's +18 deploy-scope additions.
            
            ## Verification recipe
            
            ```bash
            # 1. Validate
            charly -C box/debian box validate
            
            # 2. Build dependencies auto-resolve (debian → debian-builder → debian-coder)
            charly -C box/debian box build debian-coder
            
            # 3. Disposable-container tests
            charly check box ghcr.io/opencharly/debian-coder:latest
            
            # 4. Deploy + live tests
            charly config debian-coder
            charly start debian-coder
            charly check box ghcr.io/opencharly/debian-coder:latest
            
            # 5. Clean up
            charly stop debian-coder
            ```
            
            ## Ports
            
            | Port | Service | Bound by |
            |---|---|---|
            | 2222 | sshd-wrapper (SSH access as `user` with sudo) | `/charly-coder:sshd` |
            | 18765 | charly-mcp (entire `charly` CLI as MCP tools, Streamable HTTP) | `/charly-coder:charly-mcp` |
            
            Conflicts with the other three coder-family boxes on the same ports — use `-i <instance>` or `-p <remap>` to run alongside.
            
            ## Image size
            
            ~10.4 GB uncompressed. Comparable to fedora-coder (~14 GB); smaller due to tighter Debian package naming (no split `-devel` packages, sparser optional dependencies pulled by default).
            
            ## Cross-distro siblings
            
            The coder-family boxes share the identical `check:` block + a large set of identical candies; they diverge only in per-candy package-format sections.
            
            - `/charly-coder:fedora-coder` — RPM (Fedora 43 via fedora-nonfree).
            - `/charly-coder:arch-coder` — pacman + optional AUR.
            - `/charly-coder:ubuntu-coder` — deb on Ubuntu 24.04; **adopt mode** (`user:ubuntu`).
            - `/charly-coder:debian-coder` — this box; create mode (`user:user`).
            
            ## Related boxes
            
            - `/charly-distros:debian` — parent base.
            - `/charly-distros:debian-builder` — multi-stage builder for pixi/npm/cargo.
            
            ## Related layers (Debian-specific content)
            
            - `/charly-coder:sshd` — cross-distro sudoers via `getent passwd 1000`.
            - `/charly-coder:dev-tools` — bat → batcat symlink task.
            - `/charly-coder:language-runtimes` — Microsoft `dotnet-install.sh` cross-distro pattern.
            - `/charly-infrastructure:virtualization` — `package:` + `package_map:` pattern for libvirt.
            - `/charly-coder:build-toolchain` — Debian `-dev` package equivalents of Fedora's `-devel`.
            - `/charly-coder:gh`, `/charly-coder:docker-ce`, `/charly-coder:kubernetes-layer`, `/charly-distros:container-nesting` — each adds an upstream apt repo (with GPG key) for packages not in Debian main.
            
            ## Related commands
            
            - `/charly-core:shell`, `/charly-core:charly-config`, `/charly-core:start`, `/charly-core:stop`, `/charly-check:check`
            - `/charly-image:image` — `user_policy:` field reference
            - `/charly-build:build` — `base_user:` declaration (absent for Debian)
            - `/charly-image:layer` — authoring reference (covers `exclude_distros:`, tag-section `repos:`, Microsoft dotnet-install pattern)
            
            ## When to use this skill
            
            **MUST be invoked** when the task involves:
            
            - Building, deploying, or troubleshooting `debian-coder`.
            - Comparing cross-distro parity, especially between `debian-coder` and `ubuntu-coder` (the base images differ in their pre-existing user account).
            - Understanding why Debian needs the `dotnet-install.sh` shell task (vs Fedora's native `dotnet-sdk` rpm).
            - Adding new deb: sections to candies that are currently Fedora/Arch-only.

debian-debootstrap-builder-skill:
    skill:
        name: debian-debootstrap-builder
        family: distros
        owner: debian-debootstrap-builder
        description: |-
            Privileged debootstrap builder image (base: debian:13) — ships the
            debootstrap toolchain used to bootstrap a Debian rootfs from scratch for
            debian-debootstrap and the debian-debootstrap VM. Lives in the
            opencharly/distro-debian submodule (box/debian).
            MUST be invoked before building or troubleshooting debian-debootstrap-builder.
        content: |
            # debian-debootstrap-builder
            
            Privileged builder image that ships the **debootstrap** toolchain (the
            `debootstrap-builder` candy). It is the `from: builder:debootstrap` /
            `bootstrap_builder_image:` target for `/charly-distros:debian-debootstrap` and the
            `/charly-vm:debian-debootstrap-vm` bootstrap VM.
            
            > **Lives in `opencharly/distro-debian`** (git submodule at `box/debian`). Build:
            > `charly -C box/debian box build debian-debootstrap-builder`.
            
            ## Box Properties
            
            | Property | Value |
            |----------|-------|
            | Base | `debian:13` |
            | Distro | debian:13, debian |
            | Build | deb |
            | Layer | `debootstrap-builder` (pulled by github reference from the main repo) |
            | Home repo | opencharly/distro-debian (`box/debian`) |
            
            The `debootstrap-builder` candy (debootstrap + arch-install-scripts equivalents,
            grub, parted) **stays in the main repo** and is shared with
            `/charly-distros:ubuntu-debootstrap-builder` — both pull it by github reference. The
            `debian` distro config (debootstrap suite/mirror/base packages, bootloader
