#  opencharly/distro-debian — the Debian image family, split out of the main
#  opencharly repo (2026-05). Mounted as a git submodule at box/debian.
#
#  SINGLE-FILE config (2026-05 import-namespace cutover): every local entity
#  (the debian base + debootstrap family, the debian-coder kitchen-sink image,
#  the debian bootstrap VM, the disposable check bed) is inlined here. This repo
#  VENDORS NOTHING — every layer is an `@github.com/...` ref into main's shared
#  candy library, and the shared build-config (distro/builder/init vocabulary) is
#  EMBEDDED in the `charly` binary (`charly/charly.yml`) — not imported.
#
#  import: is a LIST — here EMPTY (`import: []`). Debian roots its bases on the
#  upstream docker.io `debian:13` image directly (no main base-stack dependency)
#  and the build vocabulary is embedded, so it imports NOTHING. The only cross-repo
#  edge is debian → main's shared candy layers via `@github` refs; there is NO
#  main ↔ debian coupling.
#
#  Directly buildable: `charly box build debian` (the build verb defaults to this
#  charly.yml). From the parent repo: `charly -C box/debian box build
#  debian`, or anywhere: `charly --repo opencharly/distro-debian box build debian`.
version: 2026.232.0520
defaults:
    platform:
        - linux/amd64
    tag: auto
    registry: ghcr.io/opencharly
    build:
        - deb
    merge:
        auto: false
        max_mb: 128
import: []
# Disposable R10 test bed for the debian bootstrap VM (kind:check — the
# 2026-05 deploy→check unification moved repo-shipped disposable beds out of
# deploy.yml). disposable: true is the sole authorization for the unattended
# destroy+rebuild driven by `charly check run check-debian-debootstrap-vm`.
check-debian-debootstrap-vm:
    vm:
        from: debian-debootstrap
        disposable: true
        lifecycle: dev
        description: Sole proof the charly toolchain installs on a from-scratch debootstrap Debian 13 VM — the charly candy's copy step lands the binary at /usr/bin/charly, the composed virtualization/gocryptfs/socat layers install their deps, and the tailscale apt-repo distro-cascade deterministically picks debian/trixie. Boots a debootstrap Debian 13 rootfs as a libvirt/QEMU VM (uefi-insecure, an auto-allocated ssh port), overlays the charly candy via add_candy, then runs four guest command checks — the binary present and executable at /usr/bin/charly (CHARLY-BINARY-OK), the welded command plugins dispatching project-less (WELDED-CMD-PROJECT-LESS-OK), the tailscale package installed (TAILSCALE-PKG-OK), and a grep asserting tailscale.list resolved to 'debian trixie'.
        # charly binary install witness: the charly candy's copy step lands the
        # in-development binary at /usr/bin/charly (the localpkg package install is
        # removed by the remove-candy-localpkg cutover). tailscale is NOT in the
        # binary — the charly candy supplies it via the tailscale apt repo, so it
        # must ALSO be present after deploy, which the tailscale-package-installed
        # check below asserts directly (the sources.list grep proves only that the
        # right suite was selected, not that the package landed).
        add_candy:
            - '@github.com/opencharly/charly/candy/charly:v2026.236.0956'
        install_opts:
            allow_repo_changes: true
            allow_root_tasks: true
            skip_incompatible: true # skip composed layers lacking a guest-format section; the charly candy's copy step + composed layers install the binary and deps
        plan:
            - check: |
                command=test -x /usr/bin/charly &&
                /usr/bin/charly version &&
                echo CHARLY-BINARY-OK
              id: charly-binary-installed
              description: charly binary installed on the guest AT /usr/bin/charly via the charly candy's copy step (the localpkg package install is removed by the remove-candy-localpkg cutover). Path-anchored deliberately — an unanchored `command -v charly` would also be satisfied by the host binary the deploy stages under /tmp, so it cannot prove the copy step landed the file at its destination.
              stdout:
                - contains: CHARLY-BINARY-OK
              exit_status: 0
              context:
                - runtime
              command: |
                test -x /usr/bin/charly &&
                /usr/bin/charly version &&
                echo CHARLY-BINARY-OK
            - check: command=dpkg -s tailscale >/dev/null 2>&1 && echo TAILSCALE-PKG-OK
              id: tailscale-package-installed
              description: the tailscale PACKAGE reached the guest via the charly candy's tailscale apt repo — tailscale is not in the charly binary, so the apt-repo cascade delivering it is exactly what this bed exists to prove. Asserting the sources.list entry alone would prove the repo was configured, not that the package installed.
              stdout:
                - contains: TAILSCALE-PKG-OK
              exit_status: 0
              context:
                - runtime
              command: dpkg -s tailscale >/dev/null 2>&1 && echo TAILSCALE-PKG-OK
            - check: the welded command plugins dispatch project-less from the installed charly binary
              id: welded-command-project-less
              description: the charly binary's compiled-in command:<word> plugins (doctor/vm/clean/…) dispatch project-less from /tmp on the installed binary
              stdout:
                - contains: WELDED-CMD-PROJECT-LESS-OK
              exit_status: 0
              context:
                - runtime
              command: |
                cd /tmp &&
                /usr/bin/charly doctor 2>/dev/null | grep -q 'Summary:' &&
                echo WELDED-CMD-PROJECT-LESS-OK
            - check: command=grep -h 'pkgs[.]tailscale[.]com/stable/debian trixie' /etc/apt/sources.list.d/tailscale.list
              id: tailscale-repo-suite-debian-trixie
              description: distro-cascade resolves the debian/trixie tailscale apt repo (not ubuntu/noble) deterministically
              exit_status: 0
              context:
                - runtime
              command: grep -h 'pkgs[.]tailscale[.]com/stable/debian trixie' /etc/apt/sources.list.d/tailscale.list
# Disposable R10 pod bed for the debian-coder developer image — closes the
# pod×debian cross-cell the submodule previously lacked (it shipped only the
# debootstrap VM bed above), mirroring box/fedora's check-fedora-coder-pod on
# the deb substrate. No `port:` — every inherited container port (sshd 2222,
# charly-mcp 18765) auto-allocates a free 127.0.0.1 host port at deploy,
# conflict-free across concurrent beds.
check-debian-coder-pod:
    pod:
        image: debian-coder
        disposable: true
        lifecycle: dev
        description: R10 bed for the debian-coder image — proves the Debian developer pod (sshd + language runtimes + AI CLIs on the Debian 13 base) builds and runs as one composed pod. Builds box:debian-coder, deploys it, and runs the composed candies' baked file/package/service/command/addr checks plus the bed's own sshd-service, language-runtime-binary, and charly status --json (status-shows-pod) probes.
        plan:
            - check: the supervised sshd service is running in the composed developer pod
              id: sshd-service-running
              context:
                - runtime
              service:
                service: sshd
                running: true
            - check: the Go language-runtime binary is baked into the developer pod
              id: golang-binary-present
              file:
                file: /usr/bin/go
                exists: true
            - check: command=charly status --json
              id: status-shows-pod
              stdout:
                - contains: '"kind": "pod"'
                - contains: check-debian-coder-pod
              context:
                - runtime
              command:
                command: charly status --json
                in_container: false
debian-debootstrap:
    vm:
        #  `source.kind: bootstrap` builds a Debian rootfs from scratch via
        #  debootstrap inside the debian-debootstrap-builder container, then boots
        #  it under libvirt/QEMU. The debootstrap builder template + distro.debian
        #  config resolve from the embedded build vocabulary (`charly/charly.yml`).
        source:
            kind: bootstrap
            builder: debootstrap
            builder_image: debian-debootstrap-builder
            distro: debian
            package:
                - sudo
                - openssh-server
                - qemu-guest-agent
                - cloud-init
            rootfs: ext4
            kernel_args: console=tty0 console=ttyS0,115200
        disk_size: 20G
        ram: 4G
        cpu: 2
        machine: q35
        firmware: uefi-insecure
        network:
            mode: user
        ssh:
            user: debian
            port_auto: true
            key_source: generate
        cloud_init:
            users:
                - name: debian
                  sudo: true
                  shell: /bin/bash
            runcmd:
                - systemctl enable --now ssh
                - systemctl enable --now qemu-guest-agent
                # Diagnostic: write boot state to /boot for post-mortem mount.
                - "{ ip a; echo ===listen===; ss -tlnp; echo ===ssh===; systemctl status ssh --no-pager; } > /boot/charly-diag.txt 2>&1"
discover:
    - path: box
      recursive: true
    - path: candy
      recursive: true
